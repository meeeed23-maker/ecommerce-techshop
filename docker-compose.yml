
services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: techshop-postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techshop-network

  # Backend Spring Boot
  backend:
    build: ./backend
    container_name: techshop-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - techshop-network
    restart: unless-stopped

  # Frontend (temporaire)
  frontend:
    build: ./frontend
    container_name: techshop-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - techshop-network

networks:
  techshop-network:
    driver: bridge

volumes:
  postgres_data:
